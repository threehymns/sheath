[package]
name = "sheath"
version = "0.1.0"
edition = "2024"
default-run = "sheath"
description = "A file manager PoC built with the Rune UI framework"

# The app is the root package, the way Hex lays out its own tree: plain `cargo build` and
# `cargo test` select this package and only this one, and `--workspace` or `-p avar` reaches the
# terminal. `crates/` holds what the app shares rather than owns.
[workspace]
members = [
    "crates/actions",
    "crates/actions-kdl",
    "crates/actions-ui",
    "crates/avar",
    "crates/chrome",
    "crates/rune-tty",
    "crates/scroll",
]
resolver = "3"

[workspace.dependencies]
# The terminal, shared by the app's pane and the standalone `avar` window. `path` is what the
# workspace builds; `version` is what a published crate needs, so the two are always in step.
rune-tty = { path = "crates/rune-tty", version = "0.1.0" }
# The app's shared UI and keymap crates. Each one has a README stating its scope; `tests/scope.rs`
# in each fails when it grows past that scope.
actions = { path = "crates/actions", version = "0.1.0" }
actions-kdl = { path = "crates/actions-kdl", version = "0.1.0" }
actions-ui = { path = "crates/actions-ui", version = "0.1.0" }
chrome = { path = "crates/chrome", version = "0.1.0" }
scroll = { path = "crates/scroll", version = "0.1.0" }
# Pinned to Rune's dev head: apps pin dev revs, as the framework's guidance recommends. One pin
# for the whole workspace, so the pane and the app are never built against two different Runes.
rune = { git = "https://github.com/anomalyco/rune", rev = "396a9af15ed63a9aede6b60871668f7f4c0665db", default-features = false }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "396a9af15ed63a9aede6b60871668f7f4c0665db" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "396a9af15ed63a9aede6b60871668f7f4c0665db" }
# The config files the app and its codecs read and write.
kdl = { version = "6.7.1", default-features = false }

[features]
# Opt-in Rust hot-patching for desktop development; see "Live editing" in README.md.
hot = ["rune/hot"]
# The terminal's text row renderer, forwarded to the crate that owns it.
text-renderer = ["rune-tty/text-renderer"]

[dependencies]
# The terminal pane, which is also the standalone `avar` window's only dependency.
rune-tty.workspace = true
# The shared keymap, its KDL codec, the palette and keybind editor, and dialog chrome.
actions.workspace = true
actions-kdl.workspace = true
actions-ui.workspace = true
chrome.workspace = true
scroll.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
kdl.workspace = true
# Rune's defaults bundle Inter and IBM Plex Mono as fallback faces; the app passes the theme's
# own fonts, so those bytes would only sit in the module unused (1.4 MB on the web build).
# `svg` (resvg rasterizing) is a native-only feature: the web build previews pictures by URL
# through the browser's own codecs, and its demo tree has no SVG, so resvg would only sit in the
# wasm unused.
rune.workspace = true
rune-kit.workspace = true
rune-theme-opencode.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Platform integration the desktop build uses: notifications over D-Bus, Rune's audio and
# the OS accessibility adapters. Rune builds nothing for the tree until an assistive client
# asks, and the adapters are named only here so the web build does not grow them.
rune = { workspace = true, features = ["accessibility", "dbus", "ogg-audio", "svg"] }
avif-decode = { version = "3", default-features = false }
# fff is the file finder behind the recursive search: it indexes the folder on screen and ranks
# the matches, so the app does not carry its own tree walk. Its index is native-only (LMDB,
# libgit2, threads), so the web demo keeps the plain walk.
fff-search = "0.11.1-nightly.f64bab2"
# Reading the clipboard for a paste into the terminal.
arboard = "3"
notify = "8"
trash = "5.2.9"
heif-oxide = "0.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"

# The terminal tests drive libghostty directly: a mouse report, a colour scheme, a progress
# state. They are native only, as the engine is.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ghostty-vt = { version = "0.8.0", default-features = false, features = [
    "kitty-graphics",
    "png",
] }
