[package]
name = "sheath"
version = "0.1.0"
edition = "2024"
description = "A file manager PoC built with the Rune UI framework"

[features]
# Opt-in Rust hot-patching for desktop development; see "Live editing" in README.md.
hot = ["rune/hot"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
kdl = { version = "6.7.1", default-features = false }
notify = "8"
# Pinned to Rune's dev head: apps pin dev revs, as the framework's guidance recommends.
rune = { git = "https://github.com/anomalyco/rune", rev = "1b787190b0965faa8fbd6a49fdadb1970374a765" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1b787190b0965faa8fbd6a49fdadb1970374a765" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "1b787190b0965faa8fbd6a49fdadb1970374a765" }
trash = "5.2.9"

[dev-dependencies]
tempfile = "3"
