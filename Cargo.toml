[package]
name = "sheath"
version = "0.1.0"
edition = "2024"
description = "A file manager PoC built with the Rune UI framework"

[features]
# Opt-in Rust hot-patching for desktop development; see "Live editing" in README.md.
hot = ["rune/hot"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
kdl = { version = "6.7.1", default-features = false }
# Pinned to Rune's dev head: apps pin dev revs, as the framework's guidance recommends.
# Rune's defaults bundle Inter and IBM Plex Mono as fallback faces; the app passes the theme's
# own fonts, so those bytes would only sit in the module unused (1.4 MB on the web build).
# `svg` (resvg rasterizing) is a native-only feature: the web build previews pictures by URL
# through the browser's own codecs, and its demo tree has no SVG, so resvg would only sit in the
# wasm unused.
rune = { git = "https://github.com/anomalyco/rune", rev = "b1457ab0d1f18cd77fa49da83155b280af2830f8", default-features = false }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b1457ab0d1f18cd77fa49da83155b280af2830f8" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "b1457ab0d1f18cd77fa49da83155b280af2830f8" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Platform integration the desktop build uses: notifications over D-Bus and Rune's audio.
rune = { git = "https://github.com/anomalyco/rune", rev = "b1457ab0d1f18cd77fa49da83155b280af2830f8", features = ["dbus", "ogg-audio", "svg"] }
avif-decode = { version = "3", default-features = false }
notify = "8"
trash = "5.2.9"
heif-oxide = "0.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"
